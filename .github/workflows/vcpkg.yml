name: Build with vcpkg

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      target-triplet:
        required: true
        type: string
      host-triplet:
        required: true
        type: string
      restore_export:
        type: boolean
        default: true
      cmake-args:
        type: string
        default: ""
    secrets:
      ARTIFACTS_KEY:
        required: false

env:
  EXPORT_EPOCH: 0
  RUNNER: ${{ inputs.runner }}
  UPLOAD_ARTIFACTS: ${{ case(secrets.ARTIFACTS_KEY == '', 0, 1) }}
  HOST_TRIPLET: ${{ inputs.host-triplet }}
  TARGET_TRIPLET: ${{ inputs.target-triplet }}
  VERBOSE: 1

jobs:
  vcpkg:
    strategy:
      fail-fast: false

    runs-on: "${{ inputs.runner }}"

    defaults:
      run:
        shell: bash

    steps:
      - name: git checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install direct system dependencies
        run: |
          case "$RUNNER" in
          macos*)
            brew install doxygen
            brew --prefix
            # https://github.com/microsoft/vcpkg/issues/48417 ?
            if test -d /usr/local/include ; then sudo mv /usr/local/include /usr/local/include-no-default ; fi
            ;;
          ubuntu*)
            sudo apt-get update
            sudo apt-get install doxygen
            ;;
          windows*)
            choco install --no-progress nsis
            echo 'C:\Program Files (x86)\NSIS' >> "$GITHUB_PATH"
            ;;
          esac
          case "$TARGET_TRIPLET" in
          *-android*)
            # Cf. SDK platforms in https://github.com/actions/runner-images/releases
            # - We target android-28 at the moment.
            # - androiddeployqt 5.12 can't handle the ext suffixes.
            ANDROID_API_VERSION=28
            ${ANDROID_HOME}/tools/bin/sdkmanager --list |
              grep "platforms;android-" |
              while read I J; do
                case "$I,$J" in #(
                *${ANDROID_API_VERSION:-NO_MATCH},*)  ${ANDROID_HOME}/tools/bin/sdkmanager --install "$I" ;;
                *,*platforms/*) ${ANDROID_HOME}/tools/bin/sdkmanager --uninstall "$I" ;;
                esac
              done
            ;;
          esac

      - name: Determine vcpkg configuration
        id: vcpkg-configuration
        env: &vcpkg_env
          VCPKG_DEFAULT_BINARY_CACHE: "${{ github.workspace }}/cache/artifacts"
          VCPKG_DOWNLOADS: "${{ github.workspace }}/cache/downloads"
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          mkdir -p "$VCPKG_DOWNLOADS"
          cd ci/vcpkg
          CONFIGURATION=$( \
            find vcpkg.json vcpkg-configuration.json overlay-ports overlay-triplets -type f -exec sha1sum '{}' ';' | \
            sed -e '/overlay-triplets[/]/ {' -e "/[/]$HOST_TRIPLET[.]cmake/ p" -e "/[/]$TARGET_TRIPLET[.]cmake/ p" -e 'd' -e '}' |
            sort -u)
          echo "$CONFIGURATION"
          echo "$CONFIGURATION" |
            sha1sum | \
            (read HASH FILE; echo hash=$HASH) | \
            tee -a "$GITHUB_OUTPUT"
          case "$TARGET_TRIPLET" in
          *-android*)
            TOOLCHAIN_FILE="$GITHUB_WORKSPACE/vcpkg-export/scripts/toolchains/android.cmake"
            ;;
          *-linux*)
            TOOLCHAIN_FILE="$GITHUB_WORKSPACE/vcpkg-export/scripts/toolchains/linux.cmake"
            ;;
          *-osx*)
            TOOLCHAIN_FILE="$GITHUB_WORKSPACE/vcpkg-export/scripts/toolchains/osx.cmake"
            ;;
          *-windows*)
            TOOLCHAIN_FILE="$GITHUB_WORKSPACE/vcpkg-export/scripts/toolchains/windows.cmake"
            ;;
          *)
            TOOLCHAIN_FILE="unknown-vcpkg-toolchain-file"
            ;;
          esac
          echo "TOOLCHAIN_FILE=${TOOLCHAIN_FILE}" >> "$GITHUB_ENV"
          case "$HOST_TRIPLET,$TARGET_TRIPLET" in
          x64-*,x64-*)
            VCVARS_ARCHITECTURE=x64
            ;;
          *)
            VCVARS_ARCHITECTURE=unknown
            ;;
          esac
          echo 'CALL_VCVARSALL=call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" ' "$VCVARS_ARCHITECTURE" >> "$GITHUB_ENV"

      - name: Restore vcpkg export
        id: restore-export
        if: github.event_name == 'pull_request' || github.event_name == 'push' || inputs.restore_export
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/vcpkg-export
          key: vcpkg-export-${{ env.EXPORT_EPOCH }}-${{ inputs.host-triplet }}_${{ inputs.target-triplet }}_${{ steps.vcpkg-configuration.outputs.hash }}

      - name: Restore vcpkg artifacts and tools
        if: steps.restore-export.outputs.cache-hit == ''
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ github.workspace }}/cache
            !${{ github.workspace }}/cache/downloads/tools
          key: vcpkg-artifacts-${{ inputs.host-triplet }}_${{ inputs.target-triplet }}_${{ steps.vcpkg-configuration.outputs.hash }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-artifacts-${{ inputs.host-triplet }}_${{ inputs.target-triplet }}_${{ steps.vcpkg-configuration.outputs.hash }}-
            vcpkg-artifacts-${{ inputs.host-triplet }}_${{ inputs.target-triplet }}_
            vcpkg-artifacts-${{ inputs.host-triplet }}_

      - name: Install transitive system dependencies
        if: steps.restore-export.outputs.cache-hit == ''
        run: |
          case "$RUNNER,$RUNNER_ARCH" in
          macos*,X64)
            brew install \
              autoconf-archive automake
            echo "#include <jconfig.h>"  | cc -E - || echo GOTCHA
            ;;
          macos*)
            brew install \
              autoconf autoconf-archive automake libtool
            ;;
          ubuntu*)
            sudo apt-get install \
              autoconf-archive \
              libltdl-dev \
              mesa-common-dev libgl1-mesa-dev libglu1-mesa-dev libgles2-mesa-dev \
              libx11-dev \
              libxaw7-dev \
              libxcursor-dev \
              libxi-dev \
              libxinerama-dev \
              libxkbcommon-x11-dev \
              libxrandr-dev \
              libxt-dev \
              libxxf86vm-dev \
              xutils-dev \
              libxext-dev libxfixes-dev libxrender-dev \
              libxcb1-dev libx11-xcb-dev libxcb-glx0-dev libxcb-util0-dev \
              libxkbcommon-dev libxcb-keysyms1-dev \
              libxcb-image0-dev libxcb-shm0-dev libxcb-icccm4-dev libxcb-sync-dev \
              libxcb-xfixes0-dev libxcb-shape0-dev libxcb-randr0-dev \
              libxcb-render-util0-dev libxcb-xinerama0-dev libxcb-xkb-dev libxcb-xinput-dev \
              libxcb-cursor-dev \
              libxtst-dev
            ;;
          esac

      - name: vcpkg install --triplet=${{ inputs.target-triplet }}
        if: steps.restore-export.outputs.cache-hit == ''
        env: *vcpkg_env
        run: |
          cd ci/vcpkg
          vcpkg install --host-triplet="$HOST_TRIPLET" --triplet="$TARGET_TRIPLET" --x-install-root='${{ github.workspace }}/vcpkg_installed'

      - name: Save vcpkg artifacts and tools to cache
        if: always() && steps.restore-export.outputs.cache-hit == ''
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ github.workspace }}/cache
            !${{ github.workspace }}/cache/downloads/tools
          key: vcpkg-artifacts-${{ inputs.host-triplet }}_${{ inputs.target-triplet }}_${{ steps.vcpkg-configuration.outputs.hash }}-${{ github.run_id }}

      - name: vcpkg export
        if: steps.restore-export.outputs.cache-hit == ''
        env: *vcpkg_env
        run: |
          cd ci/vcpkg
          case "$TARGET_TRIPLET" in
          *windows*)
            ;;
          *)
            find $GITHUB_WORKSPACE/vcpkg_installed/*/lib -type f -exec strip -S '{}' ';' || true
            find $GITHUB_WORKSPACE/vcpkg_installed/*/plugins -type f -exec strip -S '{}' ';' || true
            find $GITHUB_WORKSPACE/vcpkg_installed/*/tools -type f -executable -exec strip -S '{}' ';' || true
            ;;
          esac
          vcpkg export --raw --output-dir=$GITHUB_WORKSPACE --x-install-root=$GITHUB_WORKSPACE/vcpkg_installed
          cd "$GITHUB_WORKSPACE"
          mv vcpkg-export-* vcpkg-export
          cp -a $(cd "$VCPKG_INSTALLATION_ROOT"; pwd)/scripts/toolchains vcpkg-export/scripts
          ls -l "$VCPKG_DOWNLOADS"

      - name: Save vcpkg export to cache
        if: steps.restore-export.outputs.cache-hit == ''
        uses: actions/cache/save@v5
        with:
          path: ${{ github.workspace }}/vcpkg-export
          key: vcpkg-export-${{ env.EXPORT_EPOCH }}-${{ inputs.host-triplet }}_${{ inputs.target-triplet }}_${{ steps.vcpkg-configuration.outputs.hash }}-${{ github.run_id }}

      - name: Configure
        env:
          CMAKE_ARGS: ${{ inputs.cmake-args }}
        run: |
          mkdir build
          ${{ case(contains(inputs.target-triplet, 'windows'), 'cat << : | cmd /D /E:ON /V:OFF /K echo off', '') }}
          ${{ case(contains(inputs.target-triplet, 'windows'), '$CALL_VCVARSALL', '') }}
          cmake -S . -B build \
            -G Ninja \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=$TOOLCHAIN_FILE \
            -DVCPKG_TARGET_TRIPLET=$TARGET_TRIPLET \
            -DVCPKG_HOST_TRIPLET=$HOST_TRIPLET \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/vcpkg-export/scripts/buildsystems/vcpkg.cmake \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CROSSCOMPILING=${{ case(inputs.target-triplet != inputs.host-triplet, 'ON', 'OFF') }} \
            -DCMAKE_POLICY_DEFAULT_CMP0176=NEW \
            -DCMAKE_POLICY_DEFAULT_CMP0177=NEW \
            -DCMAKE_SUPPRESS_REGENERATION=ON \
            -DLICENSING_PROVIDER=vcpkg \
            ${{ case(contains(inputs.target-triplet, 'android'), '-DANDROID_DEPLOY_QT=$GITHUB_WORKSPACE/vcpkg-export/installed/$TARGET_TRIPLET/tools/qt5/bin/androiddeployqt', '') }} \
            $CMAKE_ARGS \
            || exit 1
          :

      - name: Build
        run: |
          ${{ case(contains(inputs.target-triplet, 'windows'), 'cat << : | cmd /D /E:ON /V:OFF /K echo off', '') }}
          ${{ case(contains(inputs.target-triplet, 'windows'), '$CALL_VCVARSALL', '') }}
          cmake --build build \
            || exit 1
          :

      - name: Test
        env:
          CTEST_OUTPUT_ON_FAILURE: 1
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/vcpkg-export/installed/${{ inputs.target-triplet }}/lib
          LD_LIBRARY_PATH: ${{ github.workspace }}/vcpkg-export/installed/${{ inputs.target-triplet }}/lib
          GDAL_DATA: ${{ github.workspace }}/vcpkg-export/installed/${{ inputs.target-triplet }}/share/gdal
          PROJ_DATA: ${{ github.workspace }}/vcpkg-export/installed/${{ inputs.target-triplet }}/share/proj
          TARGET_TRIPLET: ${{ inputs.target-triplet }}
          SKIP_POWERSHELL_POSITION_SOURCE_LIVE_TEST: 1
          # Needs Qt 6.5
          QT_WIN_DEBUG_CONSOLE: attach
        run: |
          ${{ case(contains(inputs.target-triplet, 'windows'), 'cat << : | cmd /D /E:ON /V:OFF /K echo off', '') }}
          ${{ case(contains(inputs.target-triplet, 'windows'), 'set PATH=%GITHUB_WORKSPACE%\vcpkg-export\installed\%TARGET_TRIPLET%\bin;%PATH%', '') }}
          ${{ case(contains(inputs.target-triplet, 'windows'), 'set QT_PLUGIN_PATH=%GITHUB_WORKSPACE%\vcpkg-export\installed\%TARGET_TRIPLET%\plugins', '') }}
          ${{ case(contains(inputs.target-triplet, 'windows'), '$CALL_VCVARSALL', '') }}
          ${{ case(contains(inputs.target-triplet, 'windows'), 'mkdir build\test\lib\fonts', '') }}
          ctest --test-dir build --output-on-failure --timeout 30 \
            || exit 1
          :

      - name: Package
        id: packaging
        env:
          ARTIFACTS_KEY: ${{ secrets.ARTIFACTS_KEY }}
        run: |
          ${{ case(contains(inputs.target-triplet, 'windows'), 'cat << : | cmd /D /E:ON /V:OFF /K echo off', '') }}
          ${{ case(contains(inputs.target-triplet, 'windows'), '$CALL_VCVARSALL', '') }}
          cmake --build build --target package \
            || exit 1
          :
          if test "$UPLOAD_ARTIFACTS" == "1"; then
            ARTIFACT_NAME=artifact
            echo "$ARTIFACTS_KEY" > artifacts-key.asc
            for ARTIFACT in build/OpenOrienteering-Mapper-* ; do
              gpg --batch --yes --no-tty --trust-model always --recipient-file artifacts-key.asc --encrypt "$ARTIFACT"
              echo ${ARTIFACT_NAME}=${ARTIFACT}.gpg | tee -a "$GITHUB_OUTPUT"
              ARTIFACT_NAME=${ARTIFACT_NAME}_2
            done
            rm artifacts-key.asc
          fi

      - name: Upload
        if: steps.packaging.outputs.artifact != ''
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.packaging.outputs.artifact }}
          archive: false
          compression-level: 0
          retention-days: 7

      - name: Upload (2)
        if: steps.packaging.outputs.artifact_2 != ''
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.packaging.outputs.artifact_2 }}
          archive: false
          compression-level: 0
          retention-days: 7
