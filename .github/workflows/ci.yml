name: CI

on:
  push:
    branches: [ "master", "vcpkg" ]
  pull_request:
    branches: [ "master", "vcpkg" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      restore_export:
        description: 'Restore vcpkg export from cache'
        type: boolean
        default: true
      target_pattern:
        description: 'Build jobs matching this pattern'
        type: string
        default: "^"

  # Keep cache alive
  #schedule:
  #  - cron: '10 21 * * 2,5'

concurrency:
  group: Mapper-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  CI:
    uses: dg0yt/Mapper-vcpkg/.github/workflows/ci.yml@main
    with:
      restore_export: ${{ inputs.restore_export != false }}
      target_pattern: ${{ inputs.target_pattern }}
