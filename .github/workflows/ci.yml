name: CI

on:
  push:
    branches: [ "master", "vcpkg" ]
  pull_request:
    branches: [ "master", "vcpkg" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      restore_export:
        description: 'Restore vcpkg export from cache'
        type: boolean
        default: ${{ true }}
      target_pattern:
        description: 'Build jobs matching this pattern'
        type: string
        default: "^arm64"

  # Keep cache alive
  schedule:
    - cron: '10 21 * * 2,5'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm64-macos:
    if: ${{ contains('^arm64-macos$', inputs.target_pattern) }}
    uses: dg0yt/mapper/.github/workflows/vcpkg.yml@vcpkg
    with:
      label: arm64-macos
      target-triplet: arm64-osx-dynamic-release
      host-triplet: arm64-osx-dynamic-release
      runner: macos-15
      restore_export: ${{ inputs.restore_export }}
      cmake-args: "-DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/vcpkg-export/scripts/toolchains/osx.cmake -DMapper_SYSTEM_NAME=macOS-arm64"
    secrets: inherit

  x64-linux:
    if: ${{ contains('^x64-linux$', inputs.target_pattern) }}
    uses: dg0yt/mapper/.github/workflows/vcpkg.yml@vcpkg
    with:
      label: x64-linux
      target-triplet: x64-linux-dynamic-release
      host-triplet: x64-linux-dynamic-release
      runner: ubuntu-24.04
      restore_export: ${{ inputs.restore_export }}
      cmake-args: "-DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/vcpkg-export/scripts/toolchains/linux.cmake"
    secrets: inherit

  x64-linux-debug:
    if: ${{ contains('^x64-linux-debug$', inputs.target_pattern) }}
    uses: dg0yt/mapper/.github/workflows/vcpkg.yml@vcpkg
    with:
      label: x64-linux-debug
      target-triplet: x64-linux-dynamic-release
      host-triplet: x64-linux-dynamic-release
      runner: ubuntu-24.04
      restore_export: ${{ inputs.restore_export }}
      cmake-args: "-DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/vcpkg-export/scripts/toolchains/linux.cmake -DCMAKE_BUILD_TYPE=Debug"
    secrets: inherit

  x64-macos:
    if: ${{ contains('^x64-macos$', inputs.target_pattern) }}
    uses: dg0yt/mapper/.github/workflows/vcpkg.yml@vcpkg
    with:
      label: x64-macos
      target-triplet: x64-osx-dynamic-release
      host-triplet: x64-osx-dynamic-release
      runner: macos-15-intel
      restore_export: ${{ inputs.restore_export }}
      cmake-args: "-DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/vcpkg-export/scripts/toolchains/osx.cmake -DMapper_SYSTEM_NAME=macOS-x64"
    secrets: inherit

  x64-windows:
    if: ${{ contains('^x64-windows$', inputs.target_pattern) }}
    uses: dg0yt/mapper/.github/workflows/vcpkg.yml@vcpkg
    with:
      label: x64-windows
      target-triplet: x64-windows-dynamic-release
      host-triplet: x64-windows-dynamic-release
      runner: windows-2025
      restore_export: ${{ inputs.restore_export }}
      cmake-args: "-DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=%GITHUB_WORKSPACE%/vcpkg-export/scripts/toolchains/windows.cmake -DVCPKG_CRT_LINKAGE=dynamic -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl"
      vcvars-options: x64
    secrets: inherit
