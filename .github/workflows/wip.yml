name: WIP

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      asset_destination_tag:
        description: 'Upload vcpkg source assets'
        type: string
        default: "rolling"

permissions: { content: write }

jobs:
  wip:
    name: GHA security analysis (zizmor)
    runs-on: ubuntu-latest
    steps:
    - name: Save assets
      if: inputs.asset_destination_tag != ''
	  env:
	    DESTINATION_TAG: "${{ inputs.asset_destination_tag }}"
	    GH_TOKEN: ${{ github.token }}
	  run: |
	    echo "Hello world" > foo.txt
        gh release create --draft --fail-on-no-commits "$DESTINATION_TAG"
	    gh release upload "$DESTINATION_TAG" foo.txt
